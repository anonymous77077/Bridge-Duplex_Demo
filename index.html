<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bridge-Duplex — ICLR 2027 Submission. Audio Demos · Coming Soon.">
  <meta name="theme-color" content="#f5f1e8">
  <title>Bridge-Duplex: Bridging Semantic and Generative Streams for Full-Duplex Speech-to-Speech Dialogue</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f1e8;
      color: #102b2e;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(1100px, calc(100% - 48px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding: 80px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 4.5vw, 4rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.035em;
      text-wrap: balance;
      overflow-wrap: break-word;
    }
    .submission {
      margin: 30px 0 0;
      color: #5d6d6b;
      font-size: 1rem;
      line-height: 1.6;
    }
    .coming-soon {
      margin: 48px 0 0;
      font-size: 1.12rem;
      font-weight: 650;
      line-height: 1.6;
    }
    @media (max-width: 520px) {
      main { width: calc(100% - 36px); padding: 56px 0; }
      .submission { margin-top: 24px; }
      .coming-soon { margin-top: 36px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bridge-Duplex: Bridging Semantic and Generative Streams for Full-Duplex Speech-to-Speech Dialogue</h1>
    <p class="submission">ICLR 2027 Submission</p>
    <p class="coming-soon">Audio Demos · Coming Soon</p>
  </main>
</body>
</html>
